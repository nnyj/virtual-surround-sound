name: Portable DSP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: camilladsp-linux-pipewire-amd64.tar.gz
            sha256: 04388dfbf0999732c51a972fa7c3dc7fa17437333124af7918022445c459851a
            engine: ./camilladsp
          - os: macos-15-intel
            asset: camilladsp-macos-amd64.tar.gz
            sha256: b66ff5fd036344340e10e46060eaf07a1fb45b5c092fba46f116457550085564
            engine: ./camilladsp
          - os: windows-2022
            asset: camilladsp-windows-amd64.zip
            sha256: d949de5ac5fc13282dd47155e0ac67087c09dd84baf7c7d568616bfc6e43d190
            engine: ./camilladsp.exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Update Linux package index
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install Linux audio libraries
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2t64 libpipewire-0.3-0t64
      - name: Download CamillaDSP 4.1.3
        shell: bash
        run: curl -fL -o camilladsp_archive "https://github.com/HEnquist/camilladsp/releases/download/v4.1.3/${{ matrix.asset }}"
      - name: Verify release checksum
        shell: bash
        run: python -c "assert __import__('hashlib').sha256(open('camilladsp_archive', 'rb').read()).hexdigest() == '${{ matrix.sha256 }}'"
      - name: Extract CamillaDSP
        if: runner.os != 'Windows'
        run: python -m tarfile -e camilladsp_archive .
      - name: Extract CamillaDSP on Windows
        if: runner.os == 'Windows'
        run: python -m zipfile -e camilladsp_archive .
      - name: Test audio pipeline
        run: python portable/dsp_test.py --engine ${{ matrix.engine }}
      - name: Check CoreAudio enumeration
        if: runner.os == 'macOS'
        run: python portable/vss.py devices
